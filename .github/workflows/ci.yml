name: CI

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      release_dry_run:
        description: Run the stable release rehearsal
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  security-events: write

jobs:
  specification:
    name: Specification governance
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: .go-version
          cache: false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: faustbrian/go-library-tools
          ref: 2dd7ae5aa634c99dc9aa9033d361019e5ffc9988
          path: .golib-specification-tooling
          persist-credentials: false
      - name: Validate specification governance
        env:
          SPECIFICATION_GOCACHE: ${{ runner.temp }}/go-international-specification-gocache
          SPECIFICATION_TOOL: ${{ runner.temp }}/golib-specification
          SPECIFICATION_TOOL_ROOT: ${{ github.workspace }}/.golib-specification-tooling
        run: |
          set -euo pipefail
          cleanup() {
            find "${SPECIFICATION_GOCACHE}" -depth -delete 2>/dev/null || true
            find "${SPECIFICATION_TOOL_ROOT}" -depth -delete 2>/dev/null || true
          }
          trap cleanup EXIT
          mkdir -p "${SPECIFICATION_GOCACHE}"
          (
            cd "${SPECIFICATION_TOOL_ROOT}"
            GOCACHE="${SPECIFICATION_GOCACHE}" go build -o "${SPECIFICATION_TOOL}" ./cmd/golib
          )
          find "${SPECIFICATION_TOOL_ROOT}" -depth -delete
          "${SPECIFICATION_TOOL}" specification check --online

  ci:
    uses: faustbrian/go-library-tools/.github/workflows/library-ci.yml@3367371735ac409ba101778aafbdaf8e2560064c
    with:
      tooling_sha: 3367371735ac409ba101778aafbdaf8e2560064c
      release_dry_run: ${{ inputs.release_dry_run || false }}

  required:
    name: Required
    if: always()
    needs: [ci, specification]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require shared workflow
        env:
          CI_RESULT: ${{ needs.ci.result }}
          SPECIFICATION_RESULT: ${{ needs.specification.result }}
        run: test "${CI_RESULT}" = success && test "${SPECIFICATION_RESULT}" = success
