schema_version: 1
tool_version: v1.0.4
tool_checksums_sha256: 6c1ee70e3fa7aa333d12420dc78d7740f4de78717d1979eeb8a5f70a2a124ba0
manifest:
  modules: modules.json
  packages: packages.json
evidence:
  root: .verification
mutation:
  root: .verification/mutation
  imports:
    - module: .
      archive: .verification/mutation/bootstrap/root.zip
      ledger: .verification/mutation/migration-ledger.json
api:
  baselines:
    - module: .
      mode: apidiff
      path: api/baseline.txt
operations:
  - module: .
    gate: test
    steps:
      - type: make
        makefile: verification/package.mk
        target: generated-check
        timeout: 20m
      - type: make
        makefile: verification/package.mk
        target: provenance
        timeout: 20m
  - module: .
    gate: fuzz
    steps:
      - type: go-test
        packages: ["."]
        fuzz: '^FuzzTextParsers$'
        budget: 10000x
        timeout: 20m
      - type: go-test
        packages: ["."]
        fuzz: '^FuzzPhoneAndPostalBoundedParsing$'
        budget: 10000x
        timeout: 20m
      - type: go-test
        packages: ["."]
        fuzz: '^FuzzPersistenceDecoders$'
        budget: 10000x
        timeout: 20m
      - type: go-test
        packages: [./internal/generate]
        fuzz: '^FuzzGeneratedDataXML$'
        budget: 10000x
        timeout: 20m
      - type: go-test
        packages: [./internal/generate]
        fuzz: '^FuzzGeneratedDataRanges$'
        budget: 10000x
        timeout: 20m
  - module: .
    gate: docs
    steps:
      - type: make
        makefile: verification/package.mk
        target: docs
        timeout: 20m
  - module: .
    gate: benchmark
    steps:
      - type: go-test
        packages: [./...]
        benchmark: .
        budget: 100ms
        timeout: 20m
