schema_version: 1
tool_version: v2.4.1
tool_checksums_sha256: c7ea4d433f1977d769e0a27506484457cb9e5e7252ca17d66a3c3ea37ca26132
manifest:
  modules: modules.json
  packages: packages.json
evidence:
  root: .verification
mutation:
  root: .verification/mutation
  imports:
    - module: .
      archive: .verification/mutation/bootstrap/root.zip
      ledger: .verification/mutation/migration-ledger.json
api:
  baselines:
    - module: .
      mode: apidiff
      path: api/v4.txt
operations:
  - module: .
    gate: conformance
    steps:
      - type: make
        makefile: verification/package.mk
        target: conformance
        timeout: 20m
  - module: .
    gate: test
    steps:
      - type: make
        makefile: verification/package.mk
        target: generated-check
        timeout: 20m
      - type: make
        makefile: verification/package.mk
        target: provenance
        timeout: 20m
  - module: .
    gate: fuzz
    steps:
      - type: go-test
        packages: ["."]
        fuzz: '^FuzzTextParsers$'
        budget: 10000x
        timeout: 20m
      - type: go-test
        packages: ["."]
        fuzz: '^FuzzPhoneAndPostalBoundedParsing$'
        budget: 10000x
        timeout: 20m
      - type: go-test
        packages: ["."]
        fuzz: '^FuzzPersistenceDecoders$'
        budget: 10000x
        timeout: 20m
      - type: go-test
        packages: [./internal/generate]
        fuzz: '^FuzzGeneratedDataXML$'
        budget: 10000x
        timeout: 20m
      - type: go-test
        packages: [./internal/generate]
        fuzz: '^FuzzGeneratedDataRanges$'
        budget: 10000x
        timeout: 20m
      - type: go-test
        packages: [./internationalwire]
        fuzz: '^FuzzLegacyWireDispatch$'
        budget: 10000x
        timeout: 20m
      - type: go-test
        packages: [./adapters/wire]
        fuzz: '^FuzzSuccessorWireDispatch$'
        budget: 10000x
        timeout: 20m
  - module: .
    gate: docs
    steps:
      - type: make
        makefile: verification/package.mk
        target: docs
        timeout: 20m
  - module: .
    gate: benchmark
    steps:
      - type: go-test
        packages: [./...]
        benchmark: .
        budget: 100ms
        timeout: 20m
